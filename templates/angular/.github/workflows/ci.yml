name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      # Karma default; if the project uses a different runner, adjust this line.
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  release:
    # Runs only on version tags (e.g. v1.2.0)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Production build -> zip into publish/
        run: bash scripts/publish.sh
        env:
          VERSION: ${{ github.ref_name }}
      - name: Attach zip to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.zip
